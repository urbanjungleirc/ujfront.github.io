<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <style>
    :root { --p: #4F46E5; --s: #7C3AED; --t: #059669; }
    /* Theme overrides via URL params applied by applyTheme() at runtime */
    body { background: #0f172a; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; }

    /* Stats mode — dark gradient panel (matches sls_stats.html prior art) */
    .stats-panel {
      position: relative;
      background:
        linear-gradient(135deg, rgba(21,31,46,0.88), rgba(11,19,32,0.9)) padding-box,
        linear-gradient(135deg, rgba(0,255,255,0.45), rgba(255,61,251,0.45)) border-box;
      border: 1px solid transparent;
      border-radius: 16px;
      color: #FEFDFB;
      overflow: hidden;
      padding: 1.25rem 1rem;
    }
    /* Subtle 24px grid overlay */
    .stats-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 15px;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }
    /* Ensure all direct children sit above the overlay */
    .stats-panel > * {
      position: relative;
      z-index: 1;
    }

    /* Offcanvas help panel */
    #help-panel {
      position: fixed;
      top: 0; right: 0;
      height: 100%;
      width: min(320px, 90vw);
      background: #0f172a;
      border-left: 1px solid #334155;
      box-shadow: -4px 0 24px rgba(0,0,0,0.5);
      z-index: 40;
      overflow-y: auto;
      padding: 1.25rem;
      transform: translateX(100%);
      transition: transform 200ms ease;
    }

    /* Markdown prose styles for #help-content and #desc-root */
    #help-content p, #desc-root p { margin: 0 0 0.5rem; }
    #help-content strong, #desc-root strong { font-weight: 700; }
    #help-content em, #desc-root em { font-style: italic; }
    #help-content a, #desc-root a { color: var(--p); text-decoration: underline; }
    #help-content ul, #desc-root ul { list-style: disc; padding-left: 1.25rem; margin: 0 0 0.5rem; }
    #help-content ol, #desc-root ol { list-style: decimal; padding-left: 1.25rem; margin: 0 0 0.5rem; }
    #help-content h1, #desc-root h1 { font-size: 1.25rem; font-weight: 600; margin: 0.75rem 0 0.25rem; color: #f1f5f9; }
    #help-content h2, #desc-root h2 { font-size: 1.1rem; font-weight: 600; margin: 0.75rem 0 0.25rem; color: #f1f5f9; }
    #help-content h3, #desc-root h3 { font-size: 1rem; font-weight: 600; margin: 0.5rem 0 0.25rem; color: #f1f5f9; }
  </style>
</head>
<body>
  <!-- Offcanvas help panel (static — always in DOM, survives TV/standard mode setup) -->
  <div id="help-backdrop" onclick="closeHelp()"
       class="fixed inset-0 bg-black/50 z-30" style="display:none"></div>
  <div id="help-panel" aria-label="Help panel">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wide">Help</h2>
      <button onclick="closeHelp()" class="text-slate-400 hover:text-white text-xl leading-none" aria-label="Close help">&times;</button>
    </div>
    <div id="help-content" class="text-slate-300 text-sm leading-relaxed"></div>
  </div>

  <!-- Error state: shown when sheetId/tab missing or fetch fails -->
  <div id="error-panel" class="hidden flex flex-col items-center justify-center min-h-screen p-8 text-center">
    <div class="text-5xl mb-4">&#9888;</div>
    <p id="error-msg" class="text-xl text-slate-300 mb-6"></p>
    <button id="retry-btn" class="hidden px-6 py-2 rounded-lg font-semibold text-white"
            style="background: var(--p)" onclick="loadData()">Retry</button>
  </div>

  <!-- Loading state: shown while initial fetch in progress -->
  <div id="loading-panel" class="hidden flex flex-col items-center justify-center min-h-screen">
    <div class="text-slate-400 text-lg animate-pulse">Loading&#8230;</div>
  </div>

  <!-- Main content: shown after successful fetch -->
  <div id="main-panel" class="hidden min-h-screen p-4">
    <!-- Header area -->
    <div id="header-area" class="mb-4 flex items-center gap-3 justify-between">
      <h1 id="page-title" class="text-2xl font-bold text-white flex-1 min-w-0 truncate"></h1>
      <button id="btn-help" onclick="openHelp()"
              class="shrink-0 w-7 h-7 rounded-full text-sm font-bold text-slate-400 border border-slate-600 hover:border-slate-400 hover:text-white"
              style="display:none" aria-label="Help">?</button>
      <div id="header-controls" class="shrink-0"></div>
    </div>
    <!-- Description: type:desc column label rendered as markdown (UX-01) -->
    <div id="desc-root" class="mb-4 text-slate-300 text-sm leading-relaxed"></div>
    <!-- Unknown-flag warning banner (UX-04) — amber, matches renderStats() >5000 warning -->
    <div id="warn-flags" class="rounded-lg p-3 mb-4 text-sm border"
         style="display:none;background:rgba(120,53,15,0.4);border-color:rgba(217,119,6,0.7);color:#fde68a;">
      <span class="font-semibold">Unknown column flag(s) &mdash; check spelling: </span>
      <span id="warn-flags-text"></span>
    </div>
    <!-- Leaderboard content injected here by plan 02-03 -->
    <div id="leaderboard-root"></div>
  </div>

  <script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzPeQAbuAS-25LII-tuI9JP9EYnGbi3oOT9BcMukkoRkmt9AuWMKwIyxYXsg9m303nk/exec';

  // Module-level state
  var _cache        = null;  // last successful fetch result
  var _params       = null;  // parsed URL params (set once at init)
  var _refreshTimer = null;  // setInterval handle for TV mode
  var _activeDimIdx = 0;     // active dimension tab index for the switcher (plan 02-03)

  /**
   * parseParams() — parse window.location.search into a plain object.
   * Returns { sheetId, tab, mode, window, refresh, cols, primary, secondary, tertiary }
   */
  function parseParams() {
    var sp = new URLSearchParams(window.location.search);
    var refresh = parseInt(sp.get('refresh'), 10);
    var cols = parseInt(sp.get('cols'), 10);
    return {
      sheetId:   sp.get('sheetId')   || '',
      tab:       sp.get('tab')       || '',
      mode:      sp.get('mode')      || 'leaderboard',
      window:    sp.get('window')    || null,
      refresh:   (!isNaN(refresh) && refresh >= 1) ? refresh : null,
      cols:      (!isNaN(cols))                    ? cols    : null,
      primary:   sp.get('primary')   || null,
      secondary: sp.get('secondary') || null,
      tertiary:  sp.get('tertiary')  || null
    };
  }

  /**
   * applyTheme(params) — write CSS var overrides from URL params.
   */
  function applyTheme(params) {
    if (params.primary)   document.documentElement.style.setProperty('--p', params.primary);
    if (params.secondary) document.documentElement.style.setProperty('--s', params.secondary);
    if (params.tertiary)  document.documentElement.style.setProperty('--t', params.tertiary);
  }

  /**
   * showPanel(name) — hide all three panels, show the named one ('error', 'loading', 'main').
   */
  function showPanel(name) {
    document.getElementById('error-panel').classList.add('hidden');
    document.getElementById('loading-panel').classList.add('hidden');
    document.getElementById('main-panel').classList.add('hidden');
    document.getElementById(name + '-panel').classList.remove('hidden');
  }

  /**
   * showError(msg, canRetry) — show error panel; show retry-btn only if canRetry is true.
   */
  function showError(msg, canRetry) {
    document.getElementById('error-msg').textContent = msg;
    var btn = document.getElementById('retry-btn');
    if (canRetry) {
      btn.classList.remove('hidden');
    } else {
      btn.classList.add('hidden');
    }
    showPanel('error');
  }

  /**
   * buildUrl(params) — construct the GAS request URL from parsed params.
   */
  function buildUrl(params) {
    var u = new URL(GAS_URL);
    u.searchParams.set('sheetId', params.sheetId);
    u.searchParams.set('tab', params.tab);
    u.searchParams.set('mode', params.mode);
    if (params.window) u.searchParams.set('window', params.window);
    return u.toString();
  }

  /**
   * setRetryIndicator(msg) — when a background refresh fails but _cache exists,
   * show a small error indicator in header-controls rather than blanking the screen.
   */
  function setRetryIndicator(msg) {
    var ctrl = document.getElementById('header-controls');
    ctrl.innerHTML = '<span class="text-red-400 text-sm mr-2" title="' + msg + '">&#9888; Refresh failed</span>'
      + '<button onclick="loadData()" class="text-sm px-3 py-1 rounded text-white" style="background:var(--p)">Retry</button>';
  }

  /**
   * escHtml(str) — minimal HTML escape for user-supplied content.
   */
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /**
   * renderMd(mdText) — safe markdown-to-HTML conversion using marked.js CDN.
   * Falls back to escaped plain text if marked.js CDN failed to load.
   * Content source is the Google Sheet owner (operator — trusted); see threat model T-04-03.
   */
  function renderMd(mdText) {
    if (!mdText) return '';
    if (typeof marked === 'undefined') {
      return '<p class="text-slate-300">' + escHtml(String(mdText)) + '</p>';
    }
    return marked.parse(String(mdText));
  }

  /**
   * renderDesc() — inject type:desc markdown content below #page-title into #desc-root.
   * Clears the element when _cache.desc is absent/null.
   */
  function renderDesc() {
    var root = document.getElementById('desc-root');
    if (!root) return;
    var text = (_cache && _cache.desc) ? _cache.desc : '';
    if (!text) { root.innerHTML = ''; return; }
    root.innerHTML = renderMd(text);
  }

  /**
   * openHelp() — slide the #help-panel into view and show the backdrop.
   */
  function openHelp() {
    document.getElementById('help-panel').style.transform = 'translateX(0)';
    document.getElementById('help-backdrop').style.display = 'block';
  }

  /**
   * closeHelp() — slide the #help-panel out and hide the backdrop.
   */
  function closeHelp() {
    document.getElementById('help-panel').style.transform = 'translateX(100%)';
    document.getElementById('help-backdrop').style.display = 'none';
  }

  /**
   * renderHelpButton(helpText) — show/hide ? button; populate offcanvas content.
   * #btn-help is static HTML — sibling of #header-controls, NOT inside it — so
   * startTvMode()/startStandardMode() overwrites cannot remove it (UX-02, Pitfall 1).
   */
  function renderHelpButton(helpText) {
    var btn = document.getElementById('btn-help');
    if (!btn) return;
    if (!helpText) { btn.style.display = 'none'; return; }
    btn.style.display = '';
    document.getElementById('help-content').innerHTML = renderMd(helpText);
  }

  /**
   * renderUnknownFlagWarning() — show amber #warn-flags banner when _cache.unknownFlags
   * is non-empty; hide it otherwise (UX-04, threat model T-04-04).
   * Variable text set via textContent (not innerHTML) — XSS-safe for operator column labels.
   */
  function renderUnknownFlagWarning() {
    var banner = document.getElementById('warn-flags');
    var textEl = document.getElementById('warn-flags-text');
    if (!banner || !textEl) return;
    if (!_cache || !_cache.unknownFlags || !_cache.unknownFlags.length) {
      banner.style.display = 'none';
      return;
    }
    var parts = _cache.unknownFlags.map(function(item) {
      return '"' + escHtml(item.column) + '": ' + item.flags.map(escHtml).join(', ');
    });
    textEl.textContent = parts.join('; ');
    banner.style.display = '';
  }

  /**
   * relativeTime(isoString) — convert ISO 8601 timestamp to human-readable relative string.
   * Uses Intl.RelativeTimeFormat with auto unit selection (seconds/minutes/hours/days).
   */
  function relativeTime(isoString) {
    if (!isoString) return '';
    var then = new Date(isoString);
    if (isNaN(then.getTime())) return '';
    var diffSec = Math.round((Date.now() - then.getTime()) / 1000);
    var rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
    if (Math.abs(diffSec) < 60)    return rtf.format(-diffSec, 'second');
    if (Math.abs(diffSec) < 3600)  return rtf.format(-Math.round(diffSec / 60), 'minute');
    if (Math.abs(diffSec) < 86400) return rtf.format(-Math.round(diffSec / 3600), 'hour');
    return rtf.format(-Math.round(diffSec / 86400), 'day');
  }

  /**
   * computeEffectiveCols(dimensions, params) — how many columns to show simultaneously.
   * LAYT-03: ?cols=N is a hard override.
   * LAYT-02: maxcols:N is a sheet-level flag the backend does not yet return in the response;
   *          default to showing all dimensions. Update here when backend adds metadata.maxcols.
   */
  function computeEffectiveCols(dimensions, params) {
    if (params.cols && params.cols >= 1) return params.cols;
    return dimensions.length;
  }

  /**
   * renderEntry(group) — returns HTML string for one leaderboard row.
   * Layout: rank badge · label (grows) · metric value · last-seen relative time.
   */
  function renderEntry(group) {
    var rankCls = group.rank.charAt(0) === '='
      ? 'text-yellow-400 font-bold w-10 shrink-0 text-right pr-2'
      : 'text-slate-400 font-bold w-10 shrink-0 text-right pr-2';
    var lastSeenHtml = group.lastSeen
      ? '<span class="text-slate-500 text-xs ml-2 shrink-0">' + relativeTime(group.lastSeen) + '</span>'
      : '';
    return '<div class="flex items-center py-2 border-b border-slate-700 last:border-0">'
      + '<span class="' + rankCls + '">' + escHtml(group.rank) + '</span>'
      + '<span class="flex-1 truncate text-white">' + escHtml(group.label) + '</span>'
      + '<span class="text-emerald-400 font-mono font-semibold ml-4 shrink-0">' + group.metric + '</span>'
      + lastSeenHtml
      + '</div>';
  }

  /**
   * renderColumn(dimension) — returns HTML string for one dimension column (heading + all entries).
   */
  function renderColumn(dimension) {
    var entries = dimension.groups.map(renderEntry).join('');
    return '<div class="bg-slate-800 rounded-xl p-4">'
      + '<h2 class="text-slate-300 text-sm font-semibold uppercase tracking-wide mb-3">'
      + escHtml(dimension.column) + '</h2>'
      + '<div>' + entries + '</div>'
      + '</div>';
  }

  /**
   * renderDimensionSwitcher(dimensions, effectiveCols) — returns HTML tab row.
   * Called only when dimensions.length > effectiveCols (LAYT-04).
   * Tab click: sets _activeDimIdx to that dimension's index, calls renderLeaderboard().
   */
  function renderDimensionSwitcher(dimensions, effectiveCols) {
    var tabs = dimensions.map(function(dim, i) {
      var isActive = (i === _activeDimIdx);
      var activeCls = isActive
        ? 'px-4 py-1.5 rounded-full text-sm font-semibold text-white'
        : 'px-4 py-1.5 rounded-full text-sm text-slate-400 hover:text-white';
      var activeStyle = isActive ? 'style="background:var(--p)"' : '';
      return '<button ' + activeStyle + ' class="' + activeCls + '" onclick="_activeDimIdx=' + i + ';renderLeaderboard();">'
        + escHtml(dim.column) + '</button>';
    }).join('');
    return '<div class="flex flex-wrap gap-2 mb-4">' + tabs + '</div>';
  }

  /**
   * computeStats(data) — client-side aggregation over raw _cache rows.
   * Receives the _cache object { columns[], rows[][], rowCount }.
   * Returns an array of per-column result objects in the same order as columns[].
   *
   * Per column:
   *   count        — valueList.length (non-null, non-undefined, non-empty-string values)
   *   sum          — sum of numeric values; null if no numerics
   *   avg          — sum/numericCount rounded to 2 dp; null if no numerics
   *   min          — Math.min of numeric values; null if no numerics
   *   max          — Math.max of numeric values; null if no numerics
   *   first        — rows[0][j]; null if rows is empty
   *   last         — rows[rows.length-1][j]; null if rows is empty
   *   distribution — for aggregate==='distribution' columns: [{value, count}] sorted desc;
   *                  null for all other columns
   */
  function computeStats(data) {
    var columns = data.columns || [];
    var rows    = data.rows    || [];

    return columns.map(function(col, j) {
      // Collect non-empty values for this column
      var valueList = [];
      for (var i = 0; i < rows.length; i++) {
        var v = rows[i][j];
        if (v !== null && v !== undefined && v !== '') {
          valueList.push(v);
        }
      }

      // Numeric aggregates
      var numericValues = [];
      for (var k = 0; k < valueList.length; k++) {
        var n = Number(valueList[k]);
        if (!isNaN(n)) numericValues.push(n);
      }

      var count = valueList.length;
      var sum   = numericValues.length > 0 ? numericValues.reduce(function(a, b) { return a + b; }, 0) : null;
      var avg   = (sum !== null && numericValues.length > 0)
                    ? Math.round((sum / numericValues.length) * 100) / 100
                    : null;
      var min   = numericValues.length > 0 ? Math.min.apply(null, numericValues) : null;
      var max   = numericValues.length > 0 ? Math.max.apply(null, numericValues) : null;

      // First / last read directly from rows[] (not derived from min/max)
      var first = rows.length > 0 ? rows[0][j] : null;
      var last  = rows.length > 0 ? rows[rows.length - 1][j] : null;

      // Distribution — only for columns flagged aggregate === 'distribution'
      var distribution = null;
      if (col.flags && col.flags.aggregate === 'distribution') {
        var freqMap = {};
        for (var d = 0; d < valueList.length; d++) {
          var key = String(valueList[d]);
          freqMap[key] = (freqMap[key] || 0) + 1;
        }
        // Convert to sorted array (descending count)
        distribution = Object.keys(freqMap)
          .map(function(val) { return { value: val, count: freqMap[val] }; })
          .sort(function(a, b) { return b.count - a.count; });
      }

      return { column: col, count: count, sum: sum, avg: avg, min: min, max: max,
               first: first, last: last, distribution: distribution };
    });
  }

  /**
   * renderStats() — stats mode renderer.
   * Reads _cache and _params. Injects into #leaderboard-root (same target as renderLeaderboard).
   * Shows a warning banner when _cache.rowCount > 5000 (PERF-04).
   * Renders stat cards for non-distribution columns and distribution panels for
   * columns with flags.aggregate === 'distribution'.
   * All user-data passed through escHtml() to prevent XSS (T-03-03).
   */
  function renderStats() {
    var root = document.getElementById('leaderboard-root');
    if (!_cache || !_cache.columns) { root.innerHTML = ''; return; }

    var results = computeStats(_cache);
    var html    = '';

    // PERF-04: large-dataset warning
    if (_cache.rowCount > 5000) {
      html += '<div class="rounded-lg p-3 mb-4 text-sm border"'
            + ' style="background:rgba(120,53,15,0.4);border-color:rgba(217,119,6,0.7);color:#fde68a;">'
            + 'Warning: ' + escHtml(String(_cache.rowCount))
            + ' rows loaded. Performance may be affected for very large datasets.'
            + '</div>';
    }

    // Separate stat-card columns from distribution columns
    var cardResults = results.filter(function(r) { return r.distribution === null; });
    var distResults = results.filter(function(r) { return r.distribution !== null; });

    // Helper: format a scalar value for display (null → em-dash)
    function fmtVal(v) {
      if (v === null || v === undefined) return '&mdash;';
      return escHtml(String(v));
    }

    // ── Stat cards grid ──────────────────────────────────────────────────────
    if (cardResults.length > 0) {
      html += '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">';
      cardResults.forEach(function(r) {
        html += '<div class="stats-panel">';

        // Column name label
        html += '<div class="text-xs uppercase tracking-wide text-slate-300 mb-3 font-semibold">'
              + escHtml(r.column.name) + '</div>';

        // Top row: count / sum / avg
        html += '<div class="grid grid-cols-3 gap-2 mb-2">';

        html += '<div class="text-center">'
              + '<div class="text-xs uppercase text-slate-400 mb-1">Count</div>'
              + '<div class="font-mono font-semibold text-lg" style="color:var(--t)">' + fmtVal(r.count) + '</div>'
              + '</div>';

        html += '<div class="text-center">'
              + '<div class="text-xs uppercase text-slate-400 mb-1">Sum</div>'
              + '<div class="font-mono font-semibold text-lg" style="color:var(--t)">' + fmtVal(r.sum) + '</div>'
              + '</div>';

        html += '<div class="text-center">'
              + '<div class="text-xs uppercase text-slate-400 mb-1">Avg</div>'
              + '<div class="font-mono font-semibold text-lg" style="color:var(--t)">' + fmtVal(r.avg) + '</div>'
              + '</div>';

        html += '</div>'; // end top row

        // Bottom row: min / max (2 chips)
        html += '<div class="grid grid-cols-2 gap-2 mb-3">';

        html += '<div class="text-center">'
              + '<div class="text-xs uppercase text-slate-400 mb-1">Min</div>'
              + '<div class="font-mono font-semibold text-lg" style="color:var(--t)">' + fmtVal(r.min) + '</div>'
              + '</div>';

        html += '<div class="text-center">'
              + '<div class="text-xs uppercase text-slate-400 mb-1">Max</div>'
              + '<div class="font-mono font-semibold text-lg" style="color:var(--t)">' + fmtVal(r.max) + '</div>'
              + '</div>';

        html += '</div>'; // end bottom row

        // First / Last row — string values, not accent colour
        html += '<div class="grid grid-cols-2 gap-2 border-t border-slate-700 pt-2">';

        html += '<div>'
              + '<div class="text-xs uppercase text-slate-400 mb-1">First</div>'
              + '<div class="text-slate-300 text-sm truncate">' + fmtVal(r.first) + '</div>'
              + '</div>';

        html += '<div>'
              + '<div class="text-xs uppercase text-slate-400 mb-1">Last</div>'
              + '<div class="text-slate-300 text-sm truncate">' + fmtVal(r.last) + '</div>'
              + '</div>';

        html += '</div>'; // end first/last row

        html += '</div>'; // end .stats-panel card
      });
      html += '</div>'; // end cards grid
    }

    // ── Distribution panels (full-width) ────────────────────────────────────
    distResults.forEach(function(r) {
      var entries = r.distribution;
      var maxCount = entries.length > 0 ? entries[0].count : 1;
      var capped   = entries.slice(0, 20);
      var overflow = entries.length > 20 ? entries.length - 20 : 0;

      // Distribution panels span full grid width
      html += '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">'
            + '<div class="stats-panel col-span-1 sm:col-span-2 lg:col-span-3">';

      // Column heading
      html += '<div class="text-xs uppercase tracking-wide text-slate-300 mb-3 font-semibold">'
            + escHtml(r.column.name) + '</div>';

      // Frequency rows
      capped.forEach(function(entry) {
        var pct = maxCount > 0 ? Math.round((entry.count / maxCount) * 100) : 0;
        html += '<div class="mb-2">';
        html += '<div class="flex items-center mb-1">'
              + '<span class="flex-1 text-white text-sm truncate">' + escHtml(entry.value) + '</span>'
              + '<span class="font-mono text-emerald-400 font-semibold ml-4 shrink-0">' + escHtml(String(entry.count)) + '</span>'
              + '</div>';
        // Progress bar
        html += '<div class="bg-slate-700 rounded-full h-1">'
              + '<div class="rounded-full h-1" style="width:' + pct + '%;background:var(--p)"></div>'
              + '</div>';
        html += '</div>'; // end row
      });

      if (overflow > 0) {
        html += '<div class="text-slate-500 text-xs mt-2">&hellip; and ' + overflow + ' more</div>';
      }

      html += '</div>'; // end .stats-panel
      html += '</div>'; // end full-width grid wrapper
    });

    root.innerHTML = html;
  }

  /**
   * renderLeaderboard() — main render function.
   * Reads _cache and _params; builds CSS Grid; injects into #leaderboard-root.
   * LAYT-01: 1 col mobile / 2 col tablet / N col desktop.
   * LAYT-04: dimension switcher shown only when dims.length > effectiveCols.
   * Reads from _cache only — no fetch.
   */
  function renderLeaderboard() {
    var root = document.getElementById('leaderboard-root');
    if (!_cache || !_cache.dimensions) { root.innerHTML = ''; return; }

    var dims = _cache.dimensions;
    var effectiveCols = computeEffectiveCols(dims, _params);

    // Clamp _activeDimIdx to valid range
    if (_activeDimIdx >= dims.length) _activeDimIdx = 0;

    // Dimension switcher — shown only when dims exceed visible cols (LAYT-04)
    var switcherHtml = (dims.length > effectiveCols)
      ? renderDimensionSwitcher(dims, effectiveCols)
      : '';

    // Slice the visible dimensions for this "page"
    var visibleDims = dims.slice(_activeDimIdx, _activeDimIdx + effectiveCols);

    // CSS Grid: responsive via Tailwind classes + injected style for desktop col count.
    // Mobile: grid-cols-1 (Tailwind default)
    // Tablet 768–1199px: md:grid-cols-2
    // Desktop >= 1200px: effectiveCols via injected <style> (Tailwind CDN cannot generate
    //   dynamic arbitrary values like grid-cols-[N] at runtime).
    // !important ensures the xl media query override wins over md:grid-cols-2.
    var colCount = Math.min(visibleDims.length, effectiveCols);
    var gridStyle = '<style>'
      + '@media (min-width: 1200px) { .lb-grid { grid-template-columns: repeat(' + colCount + ', minmax(0, 1fr)) !important; } }'
      + '</style>';

    var columns = visibleDims.map(renderColumn).join('');

    // LAYT-01: grid-cols-1 (mobile) md:grid-cols-2 (tablet) + xl override via injected style
    var gridHtml = '<div class="lb-grid grid grid-cols-1 md:grid-cols-2 gap-4">' + columns + '</div>';

    root.innerHTML = gridStyle + switcherHtml + gridHtml;
  }

  /**
   * renderAll() — wires rendering into the fetch lifecycle.
   * Dispatches to renderStats() when _params.mode === 'stats'; otherwise renderLeaderboard().
   */
  function renderAll() {
    if (_params && _params.mode === 'stats') { renderStats(); } else { renderLeaderboard(); }
    renderDesc();
    renderHelpButton(_cache ? _cache.help : null);
    renderUnknownFlagWarning();
  }

  /**
   * updateLastUpdated() — update the "Last updated" indicator.
   * TV mode (DISP-03): fixed-position element in bottom-right corner outside main-panel.
   * Standard mode (DISP-03): updates text span injected by startStandardMode() in header-controls.
   */
  function updateLastUpdated() {
    if (!_cache || !_cache.generatedAt) return;
    var rel = relativeTime(_cache.generatedAt);
    if (_params.refresh) {
      // TV mode: "Last updated" in top-right corner
      var corner = document.getElementById('tv-last-updated');
      if (!corner) {
        corner = document.createElement('div');
        corner.id = 'tv-last-updated';
        corner.className = 'fixed bottom-3 right-4 text-slate-500 text-xs';
        document.body.appendChild(corner);
      }
      corner.textContent = 'Updated ' + rel;
    } else {
      // Standard mode: update the text span injected by startStandardMode()
      var span = document.getElementById('last-updated-text');
      if (span) span.textContent = 'Updated ' + rel;
    }
  }

  /**
   * startTvMode() — activates TV/kiosk behaviour (DISP-01, DISP-05).
   * No manual controls in header-controls; starts silent autorefresh interval.
   * Called once after the first successful loadData() when _params.refresh is set.
   */
  function startTvMode() {
    // DISP-01: no manual controls — header-controls stays empty
    document.getElementById('header-controls').innerHTML = '';

    // Clear any existing timer before setting a new one
    if (_refreshTimer) clearInterval(_refreshTimer);

    var intervalMs = _params.refresh * 1000;
    _refreshTimer = setInterval(function() {
      // DISP-04: loadData() keeps main-panel visible during background fetch (no flicker)
      // _activeDimIdx is module-level — preserved across this call automatically
      loadData();
    }, intervalMs);
  }

  /**
   * startStandardMode() — sets up Refresh button and "Last updated" indicator (DISP-02, DISP-05).
   * Called once after the first successful loadData() when _params.refresh is falsy.
   */
  function startStandardMode() {
    var ctrl = document.getElementById('header-controls');
    ctrl.innerHTML =
      '<span id="last-updated-text" class="text-slate-400 text-sm mr-3"></span>'
      + '<button onclick="loadData()" class="px-4 py-1.5 rounded-lg text-sm font-semibold text-white" style="background:var(--p)">Refresh</button>';
    // Populate the text immediately (generatedAt is already in _cache from first fetch)
    updateLastUpdated();
  }

  /**
   * setupMode() — called once after the first successful loadData().
   * Discriminates on _params.refresh (DISP-05): TV mode or standard mode.
   */
  function setupMode() {
    if (_params.refresh && _params.refresh >= 1) {
      startTvMode();
    } else {
      startStandardMode();
    }
  }

  /**
   * loadData(onFirstLoad) — fetch GAS endpoint, cache result, render or show error.
   * FPAR-04: full response stored in _cache after every successful fetch.
   * FPAR-06: on error with prior cache, show retry indicator without blanking screen.
   * DISP-04: if _cache is already set, main-panel stays visible during fetch (no flicker).
   * onFirstLoad: optional callback invoked once after the first successful fetch (used by init).
   */
  function loadData(onFirstLoad) {
    // If _cache is null (first load), show loading panel.
    // If _cache is already set (background refresh), leave main panel visible — no flicker (DISP-04).
    if (_cache === null) {
      showPanel('loading');
    }

    // Use $.ajax with dataType:'jsonp' — GAS /exec redirects via script.google.com which
    // Chrome blocks cross-origin (both fetch() and XHR fail on the redirect). JSONP bypasses
    // CORS entirely: jQuery injects a <script> tag and GAS wraps JSON in the callback function.
    // GAS Code.gs reads e.parameter.callback and calls makeResponse_() to wrap the response.
    $.ajax({
      url: buildUrl(_params),
      method: 'GET',
      dataType: 'jsonp',
      success: function(data) {
        if (data.error) {
          var msg = data.message || 'GAS returned an error response';
          if (_cache) { setRetryIndicator(msg); } else { showError('Could not load data: ' + msg, true); }
          return;
        }
        _cache = data;
        showPanel('main');
        renderAll();
        updateLastUpdated();
        if (typeof onFirstLoad === 'function') onFirstLoad();
      },
      error: function(jqXHR, textStatus, errorThrown) {
        var msg = errorThrown || textStatus || 'Request failed';
        // FPAR-06: preserve _cache data on screen if it exists
        if (_cache) { setRetryIndicator(msg); } else { showError('Could not load data: ' + msg, true); }
      }
    });
  }

  /**
   * init() — entry point called on DOMContentLoaded.
   */
  function init() {
    _params = parseParams();
    applyTheme(_params);

    // Validate required params
    if (!_params.sheetId || !_params.tab) {
      showError('sheetId and tab URL parameters are required', false);
      return;
    }

    // Set page title from tab name
    document.getElementById('page-title').textContent = _params.tab;

    showPanel('loading');
    loadData(setupMode);  // setupMode called once after first successful fetch (DISP-05)
  }

  document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

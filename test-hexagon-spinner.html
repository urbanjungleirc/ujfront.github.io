<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Spinner Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/spinner-animations.css">
    <style>
        body {
            background: linear-gradient(135deg, #0B1320 0%, #1a2332 50%, #0B1320 100%);
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .demo-card {
            background: rgba(11, 19, 32, 0.95);
            border: 2px solid var(--spinner-color-4);
            border-radius: 1rem;
            padding: 2rem;
            margin: 1rem;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .demo-title {
            color: #FEFDFB;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            color: #FEFDFB;
            text-align: center;
            padding: 2rem 0;
            font-weight: 300;
            letter-spacing: 3px;
        }

        .btn-neon {
            background: transparent;
            border: 2px solid var(--spinner-color-2);
            color: var(--spinner-color-2);
            padding: 0.75rem 1.5rem;
            margin: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-neon:hover {
            background: var(--spinner-color-2);
            color: #0B1320;
            box-shadow: 0 0 20px var(--spinner-color-2);
        }

        .btn-neon.active {
            background: var(--spinner-color-1);
            border-color: var(--spinner-color-1);
            color: #0B1320;
        }

        .controls {
            text-align: center;
            padding: 1rem;
        }

        .color-swatches {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .swatch {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .swatch-label {
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
            text-align: center;
            margin-top: 0.25rem;
        }

        .featured {
            transform: scale(1.5);
            margin: 3rem auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1>SLS Spinner Animations</h1>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-neon" onclick="testModal('hexagon')">Test Hexagon</button>
            <button class="btn btn-neon" onclick="testModal('logo')">Test Logo</button>
            <button class="btn btn-neon" onclick="testModal('geometric')">Test Geometric</button>
            <button class="btn btn-neon" onclick="testModal('pulse')">Test Pulse</button>
            <button class="btn btn-neon" onclick="testModal('wave')">Test Wave</button>
            <button class="btn btn-neon" onclick="testModal()">Random</button>
        </div>

        <!-- Featured: New Hexagon Animation -->
        <div class="row justify-content-center mt-4">
            <div class="col-md-6">
                <div class="demo-card">
                    <div class="demo-title">New: Hexagon Formation</div>
                    <div class="featured">
                        <div class="spinner-hexagon">
                            <div class="triangle tri-1"></div>
                            <div class="triangle tri-2"></div>
                            <div class="triangle tri-3"></div>
                            <div class="triangle tri-4"></div>
                            <div class="triangle tri-5"></div>
                            <div class="triangle tri-6"></div>
                            <div class="hexagon-glow"></div>
                        </div>
                    </div>
                    <p class="spinner-slogan">Converging triangles...</p>
                </div>
            </div>
        </div>

        <!-- Color Palette -->
        <div class="color-swatches">
            <div>
                <div class="swatch" style="background: var(--spinner-color-1);"></div>
                <div class="swatch-label">Magenta</div>
            </div>
            <div>
                <div class="swatch" style="background: var(--spinner-color-2);"></div>
                <div class="swatch-label">Cyan</div>
            </div>
            <div>
                <div class="swatch" style="background: var(--spinner-color-3);"></div>
                <div class="swatch-label">Yellow</div>
            </div>
            <div>
                <div class="swatch" style="background: var(--spinner-color-4);"></div>
                <div class="swatch-label">Purple</div>
            </div>
            <div>
                <div class="swatch" style="background: var(--spinner-color-5);"></div>
                <div class="swatch-label">Coral</div>
            </div>
            <div>
                <div class="swatch" style="background: var(--spinner-color-6);"></div>
                <div class="swatch-label">Mint</div>
            </div>
        </div>

        <!-- All Animations Side by Side -->
        <h1 class="mt-5">All Animations</h1>
        <div class="row justify-content-center">
            <div class="col-md-2">
                <div class="demo-card">
                    <div class="demo-title">Logo</div>
                    <div class="spinner-logo">
                        <img src="https://tools.urbanjungleirc.com/assets/img/sls_logo.png" alt="SLS" class="logo-spin">
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="demo-card">
                    <div class="demo-title">Geometric</div>
                    <div class="spinner-geometric">
                        <div class="shape shape-1"></div>
                        <div class="shape shape-2"></div>
                        <div class="shape shape-3"></div>
                        <div class="shape shape-4"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="demo-card">
                    <div class="demo-title">Pulse</div>
                    <div class="spinner-pulse">
                        <div class="ring ring-1"></div>
                        <div class="ring ring-2"></div>
                        <div class="ring ring-3"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="demo-card">
                    <div class="demo-title">Hexagon</div>
                    <div class="spinner-hexagon">
                        <div class="triangle tri-1"></div>
                        <div class="triangle tri-2"></div>
                        <div class="triangle tri-3"></div>
                        <div class="triangle tri-4"></div>
                        <div class="triangle tri-5"></div>
                        <div class="triangle tri-6"></div>
                        <div class="hexagon-glow"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Wave (full width) -->
        <div class="row justify-content-center mt-3">
            <div class="col-md-6">
                <div class="demo-card">
                    <div class="demo-title">Wave (Tick Icons)</div>
                    <div class="spinner-wave">
                        <div class="tick-icon tick-1">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H4zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>
                            </svg>
                        </div>
                        <div class="tick-icon tick-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H4zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>
                                <rect width="10.508" height="4.264" x="2.876" y="10.75"/>
                            </svg>
                        </div>
                        <div class="tick-icon tick-3">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H4zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>
                                <rect width="10.508" height="9.106" x="2.876" y="5.908"/>
                            </svg>
                        </div>
                        <div class="tick-icon tick-4">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 0h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2z"/>
                            </svg>
                        </div>
                        <div class="tick-icon tick-5">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M5.52.359A.5.5 0 0 1 6 0h4a.5.5 0 0 1 .474.658L8.694 6H12.5a.5.5 0 0 1 .395.807l-7 9a.5.5 0 0 1-.873-.454L6.823 9.5H3.5a.5.5 0 0 1-.48-.641l2.5-8.5z"/>
                            </svg>
                        </div>
                        <div class="tick-icon tick-6">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 0h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2z"/>
                            </svg>
                        </div>
                        <div class="tick-icon tick-7">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H4zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>
                                <rect width="10.508" height="9.106" x="2.876" y="5.908"/>
                            </svg>
                        </div>
                        <div class="tick-icon tick-8">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H4zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>
                                <rect width="10.508" height="4.264" x="2.876" y="10.75"/>
                            </svg>
                        </div>
                        <div class="tick-icon tick-9">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H4zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center py-4">
            <small style="color: rgba(255,255,255,0.5);">SLSSpinner.show('hexagon') | SLSSpinner.show() for random</small>
        </div>
    </div>

    <!-- Modal for testing -->
    <div class="modal fade" id="modalSpinner" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content spinner-modal-content">
                <div class="modal-body text-center spinner-container">
                    <!-- Content inserted dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/sls-spinner.js"></script>
    <script>
        function testModal(type) {
            SLSSpinner.show(type);
            // Auto-hide after 5 seconds
            setTimeout(() => SLSSpinner.hide(), 5000);
        }
    </script>
</body>
</html>

<!doctype html>
<meta charset="utf-8">
<title>TV wake test</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#fff;
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2vh;text-align:center}
  #clock{font-size:16vw;font-weight:700;letter-spacing:.02em;line-height:1}
  .row{font-size:3.2vw;font-weight:600}
  .ok{color:#4ade80}.bad{color:#f87171}.warn{color:#fbbf24}
  #started{font-size:2.2vw;color:#9ca3af}
  video{position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none}
</style>
<div class="wrap">
  <div id="clock">00:00</div>
  <div class="row" id="wl">wake lock: …</div>
  <div class="row" id="vid">video: …</div>
  <div id="started"></div>
</div>
<video id="keep" muted playsinline autoplay></video>
<script>
  const $ = id => document.getElementById(id);
  const t0 = Date.now();
  $("started").textContent = "started " + new Date().toLocaleTimeString();

  // Elapsed timer — if the screen sleeps, this is where it visibly freezes.
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("clock").textContent =
      String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 1000);

  // 1) Screen Wake Lock (needs HTTPS — the real candidate fix)
  let lock = null;
  async function acquire() {
    if (!("wakeLock" in navigator)) {
      $("wl").textContent = "wake lock: UNSUPPORTED";
      $("wl").className = "row bad";
      return;
    }
    try {
      lock = await navigator.wakeLock.request("screen");
      $("wl").textContent = "wake lock: ACTIVE";
      $("wl").className = "row ok";
      lock.addEventListener("release", () => {
        $("wl").textContent = "wake lock: RELEASED " + new Date().toLocaleTimeString();
        $("wl").className = "row warn";
      });
    } catch (e) {
      $("wl").textContent = "wake lock: FAILED " + e.name;
      $("wl").className = "row bad";
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") acquire();
  });
  acquire();

  // 2) Belt-and-braces: a genuinely-playing muted video from a canvas stream
  //    (no asset needed). Devices often stay awake during media playback.
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 16;
    const cx = c.getContext("2d");
    setInterval(() => {
      cx.fillStyle = "#" + (((Math.random() * 0xffffff) | 0).toString(16)).padStart(6, "0");
      cx.fillRect(0, 0, 16, 16);
    }, 250);
    $("keep").srcObject = c.captureStream(10);
    $("keep").play().then(
      () => { $("vid").textContent = "video: PLAYING"; $("vid").className = "row ok"; },
      e  => { $("vid").textContent = "video: BLOCKED " + e.name; $("vid").className = "row bad"; }
    );
  } catch (e) {
    $("vid").textContent = "video: ERR " + e.name;
    $("vid").className = "row bad";
  }
</script>

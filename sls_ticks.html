    <link href="https://cdn.datatables.net/buttons/3.2.0/css/buttons.bootstrap5.min.css" rel="stylesheet">

    <style>
        /* SPINNER */
        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            box-shadow: inset -2px 0 0 2px rgb(255, 217, 0);
        }

        h1,
        h2,
        h3,
        h4, 
        .sls-font {
            font-family: 'FatFrank', sans-serif;
        }
    </style>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NP52DRP3"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <header>
        <div class="px-3 py-2 text-bg-primary border-bottom slide-in-top stagger-1">
            <div class="container-md">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <div class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white">
                        <div class="flex-shrink-0">
                            <img src="./assets/img/sls_logo.png" alt="SLS" width="100" height="100">
                        </div>
                        <div class="flex-grow-1 ms-3">
                            <h1>Summer Lead Series <span id="sls_year"></span></br><span class="text-white-50">Urban Jungle IRC</span></h1>
                        </div>
                    </div>
                    <div class="flex-grow-1 ms-3 text-end">
                        <div class="text-light d-flex flex-column justify-content-center align-items-end">
                            <h2>Ticks & Sends</h2>
                            <a href="sls.html" class="btn btn-primary"><i class="bi bi-arrow-left"></i> Back to Leaderboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-3 py-2 border-bottom mb-3 bg-white slide-in-top stagger-2">
            <div class="container-md">
                <div class="d-flex flex-wrap justify-content-between align-items-center">
                    <div class="d-flex mb-2 mb-lg-0">
                        <p class="text-primary mb-0" id="timer">
                            Time left to score </br>
                            <span data-days class="text-primary fw-bold"></span>d
                            <span data-hours class="text-primary fw-bold"></span>h
                            <span data-minutes class="text-primary fw-bold"></span>m
                        </p>
                    </div>
                    <div class="d-flex align-items-center gap-3 ms-auto">
                        <span id="refreshButton" class="btn btn-outline-primary rounded-modern shadow-depth-1" data-bs-toggle="tooltip"
                            data-bs-placement="left" title="Reload data" onclick="refreshData()"><i class="bi bi-arrow-clockwise"></i>
                        </span>
                        <p class="text-primary text-end mb-0">Scores from</br>
                            <span id="updatedAt" class="fw-bold"></span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="sponsor-strip slide-in-top stagger-3 my-lg-5 my-2">
        <div class="container-md">
            <div class="sponsor-strip__inner">
                <span class="sponsor-strip__label">Sponsors</span>
                <div class="sponsor-strip__logos">
                    <a class="sponsor-logo-link slide-in-top stagger-1" href="https://www.camp.it/d/ot/en/outdoor" target="_blank" rel="noopener">
                        <img src="assets/img/sponsors/camp_logo_white.png" alt="CAMP" class="sponsor-logo" loading="lazy">
                    </a>
                    <a class="sponsor-logo-link slide-in-top stagger-2" href="https://www.climbinganchors.com.au/" target="_blank" rel="noopener">
                        <img src="assets/img/sponsors/climbing_anchors_logo_white.png" alt="Climbing Anchors"
                            class="sponsor-logo" loading="lazy">
                    </a>
                    <a class="sponsor-logo-link slide-in-top stagger-3" href="https://edelrid.com/int-en" target="_blank" rel="noopener">
                        <img src="assets/img/sponsors/edelrid_logo_white.png" alt="Edelrid" class="sponsor-logo"
                            loading="lazy">
                    </a>
                </div>
            </div>
        </div>
    </section>

    <main class="container-md p-1 my-5">
        <!-- Two-column responsive layout -->
        <div class="row g-3 my-lg-3">

             <!-- Table Section (60% on desktop, full width on mobile) -->
            <div class="col-12 col-md-7 slide-in-top stagger-4">
                <h3 class="text-center">Individual Sends</h3>
                <div class="table-responsive results-panel" style="width: 100%;">
                    <table id="tableMale" class="table table-striped align-middle bg-white align-bottom rounded-modern"
                        style="width: 100%;">
                        <tbody class="table-group-divider"></tbody>
                    </table>
                </div>
            </div>

            <!-- Latest Ticks Section (40% on desktop, full width on mobile) -->
            <div class="col-12 col-md-5 slide-in-left stagger-3">
                <h3 class="text-center">Latest Ticks</h3>
                <div class="d-flex justify-content-center gap-2 mb-2 small">
                    <span class="text-round1 fw-semibold">R1</span>
                    <span class="text-round2 fw-semibold">R2</span>
                    <span class="text-round3 fw-semibold">R3</span>
                    <span class="text-round4 fw-semibold">R4</span>
                </div>
                <!-- Scrollable container for Latest Ticks -->
                <div id="latest-ticks-container" class="list-group px-3"
                     style="max-height: 600px; overflow-y: auto;">
                    <div id="latest-ticks"></div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-primary">
        <div class="container-md d-flex flex-wrap justify-content-between align-items-center py-3 my-4">
            <div class="col-md-4 d-flex align-items-center text-white">
                <span class="mb-3 mb-md-0">© <span id="year"></span> Urban Jungle IRC, Jandakot WA</span>
            </div>
            <a href="http://urbanjungleirc.com"
                class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
                <img src="assets/img/UrbanJungle_Logo_transparent_with_shadow.png" class="img-fluid"
                    style="max-width: 100px;" alt="Urbna Jungle IRC">
            </a>
            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-1"><a class="btn btn-primary border-0 " href="http://www.facebook.com/urbanjungleirc"><i
                            class="bi bi-facebook"></i></a></li>
                <li class="ms-1"><a class="btn btn-primary border-0" href="mailto:frontdesk@urbanjungleirc.com"><i
                            class="bi bi-envelope"></i></a></li>
                <li class="ms-1"><a class="btn btn-primary border-0" href="https://www.instagram.com/urbanjungleirc"><i
                            class="bi bi-instagram"></i></a></li>
            </ul>
        </div>
    </footer>

    <!-- Spinner Modal (SLS Animated Spinner System) -->
    <div class="modal fade" id="modalSpinner" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-hidden="true" aria-labelledby="spinnerLabel" aria-live="polite">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content spinner-modal-content">
                <div class="modal-body text-center spinner-container">
                    <!-- Animation and slogan will be dynamically inserted here by sls-spinner.js -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/sls-spinner.js"></script> <!-- SLS Animated Spinner System -->

    <script src="https://cdn.datatables.net/buttons/3.2.0/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.2.0/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/datetime/1.5.4/js/dataTables.dateTime.min.js"></script>
    <script src="https://cdn.datatables.net/fixedheader/4.0.1/js/dataTables.fixedHeader.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.3/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.3/js/responsive.bootstrap5.js"></script>
    <script src="https://cdn.datatables.net/rowgroup/1.5.1/js/dataTables.rowGroup.min.js"></script>
    <script src="https://cdn.datatables.net/searchpanes/2.3.3/js/dataTables.searchPanes.min.js"></script>
    <script src="https://cdn.datatables.net/searchpanes/2.3.3/js/searchPanes.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/select/2.1.0/js/dataTables.select.min.js"></script>
    <!-- <script src="https://cdn.datatables.net/1.12.0/js/jquery.dataTables.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.2.1/build/global/luxon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/countdown/2.6.0/countdown.min.js"></script>

    <!-- custom -->
    <script src="assets/js/sls_ticks.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        document.getElementById('sls_year').textContent = new Date().getFullYear();
    </script>

</body>

</html>

name = "uj-payments"
main = "src/index.js"
compatibility_date = "2026-05-28"

[vars]
ALLOWED_ORIGINS = "https://www.urbanjungleirc.com,https://urbanjungleirc.com,http://localhost:5500,http://127.0.0.1:5500"
PUBLIC_BASE_URL = "https://www.urbanjungleirc.com"

<!--
  Urban Jungle — "Book the next Social Night" button
  ---------------------------------------------------
  Paste this whole block into a Squarespace Code Block (HTML mode).

  What it does
    1. Renders a button straight away ("Book the next Social Night") that links
       to the public Clubworx calendar, so there is never an empty gap.
    2. Asks the same Google Apps Script proxy the events calendar uses for the
       upcoming ".: Social Night :." sessions (next 3 months).
    3. Rewrites the button to "Book the next Social Night · Wed 7 Oct" and
       links straight to that session's Clubworx booking page.

  Edge cases
    - nearest session is full      -> "Wed 7 Oct is full · book Wed 4 Nov"
    - every session is full        -> "Social Nights are booked out" (calendar link)
    - nothing scheduled in window  -> "No Social Night scheduled yet · see the calendar"
    - proxy down / slow / error    -> placeholder button stays (calendar link)

  Settings you may want to change are at the top of the <script>.
-->
<div class="uj-social-night" data-uj-social-night>
  <a class="sqs-block-button-element--medium sqs-button-element--primary sqs-block-button-element uj-social-night__btn"
     href="https://app.clubworx.com/websites/urban-jungle-indoor-rock-climbing-1/calendar"
     target="_blank" rel="noopener">Book the next Social Night</a>
  <p class="uj-social-night__note" hidden></p>
</div>

<style>
  .uj-social-night { text-align: center; margin: 1em 0; }
  /* Fallback look, only used if the Squarespace button classes are absent */
  .uj-social-night__btn:not(.sqs-block-button-element) {
    display: inline-block; padding: 0.9em 1.8em; border-radius: 4px;
    background: #ff4709; color: #fff; text-decoration: none; font-weight: 600;
  }
  .uj-social-night__btn.is-loading { opacity: 0.85; }
  .uj-social-night__note { margin: 0.6em 0 0; font-size: 0.9em; opacity: 0.8; }
</style>

<script>
(function () {
  // ---- settings -----------------------------------------------------------
  var PROXY_URL   = 'https://script.google.com/macros/s/AKfycbx79mAIC4UHh3OWMMWMsklKyWniEEHBTVwsVdqFmdCRguncLdNX4Heq9o7F_5wx_mKaLA/exec';
  var SEARCH_TEXT = 'social night';   // matched case-insensitively against the Clubworx event name
  var PERIOD      = '3m';             // how far ahead to look
  var TIMEZONE    = 'Australia/Perth';
  var CALENDAR_URL = 'https://app.clubworx.com/websites/urban-jungle-indoor-rock-climbing-1/calendar';
  var EVENT_URL    = CALENDAR_URL + '/event/';
  var TIMEOUT_MS   = 12000;
  var CALLBACK     = 'ujSocialNightCallback';
  // -------------------------------------------------------------------------

  // Guard: only the first copy of this block on a page does the work.
  if (window.__ujSocialNightLoaded) { return; }
  window.__ujSocialNightLoaded = true;

  var root = document.querySelector('[data-uj-social-night]');
  if (!root) { return; }
  var btn  = root.querySelector('.uj-social-night__btn');
  var note = root.querySelector('.uj-social-night__note');
  btn.classList.add('is-loading');

  function setButton(text, href) {
    btn.textContent = text;
    btn.href = href;
    btn.classList.remove('is-loading');
  }
  function setNote(text) {
    note.textContent = text || '';
    note.hidden = !text;
  }

  // "Wed 7 Oct" in Perth time, regardless of the visitor's own timezone.
  function shortDate(iso) {
    try {
      return new Intl.DateTimeFormat('en-AU', {
        weekday: 'short', day: 'numeric', month: 'short', timeZone: TIMEZONE
      }).format(new Date(iso)).replace(/,/g, '');
    } catch (e) {
      return new Date(iso).toDateString().slice(0, 10);
    }
  }
  function todayIso() {
    try {
      var p = new Intl.DateTimeFormat('en-CA', {
        year: 'numeric', month: '2-digit', day: '2-digit', timeZone: TIMEZONE
      }).format(new Date());
      return p; // en-CA gives YYYY-MM-DD
    } catch (e) {
      return new Date().toISOString().slice(0, 10);
    }
  }
  function isFull(ev) {
    return ev.event_full === true || Number(ev.spaces_available) <= 0;
  }

  var timer = null;
  var done  = false;

  window[CALLBACK] = function (events) {
    if (done) { return; }
    done = true;
    clearTimeout(timer);
    try {
      var now = Date.now();
      var upcoming = (Array.isArray(events) ? events : [])
        .filter(function (ev) { return ev && ev.event_id && ev.event_start_at; })
        .filter(function (ev) { return new Date(ev.event_end_at || ev.event_start_at).getTime() > now; })
        .sort(function (a, b) { return new Date(a.event_start_at) - new Date(b.event_start_at); });

      if (upcoming.length === 0) {
        setButton('No Social Night scheduled yet · see the calendar', CALENDAR_URL);
        setNote('');
        return;
      }

      var open = upcoming.filter(function (ev) { return !isFull(ev); });
      if (open.length === 0) {
        setButton('Social Nights are booked out · see the calendar', CALENDAR_URL);
        setNote('The next one on ' + shortDate(upcoming[0].event_start_at) + ' is full.');
        return;
      }

      var next = open[0];
      if (next !== upcoming[0]) {
        // The nearest session is full; point at the first one with space.
        setButton(shortDate(upcoming[0].event_start_at) + ' is full · book ' + shortDate(next.event_start_at),
                  EVENT_URL + next.event_id);
        setNote('');
        return;
      }

      setButton('Book the next Social Night · ' + shortDate(next.event_start_at), EVENT_URL + next.event_id);
      setNote('');
    } catch (e) {
      // Any surprise in the data: leave the placeholder calendar link in place.
      btn.classList.remove('is-loading');
    }
  };

  function giveUp() {
    if (done) { return; }
    done = true;
    btn.classList.remove('is-loading'); // placeholder text + calendar link remain
  }

  var script = document.createElement('script');
  script.src = PROXY_URL +
    '?attribute=jsonp' +
    '&searchText=' + encodeURIComponent(SEARCH_TEXT) +
    '&date=' + todayIso() +
    '&period=' + PERIOD +
    '&callback=' + CALLBACK;
  script.async = true;
  script.onerror = giveUp;
  timer = setTimeout(giveUp, TIMEOUT_MS);
  document.head.appendChild(script);
})();
</script>

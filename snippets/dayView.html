<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Jungle — Day Schedule</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/uj_colors.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .event-card {
            border-radius: 6px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .event-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12) !important;
        }

        /* Collapsed state */
        .event-card.is-collapsed { opacity: 0.65; }
        .event-card.is-collapsed:hover { opacity: 1; }
        .event-card.is-collapsed .card-full { display: none; }
        .event-card:not(.is-collapsed) .card-collapsed { display: none; }

        /* Chevron icon via CSS so we don't need JS class swaps */
        .toggle-icon { font-style: normal; }
        .event-card.is-collapsed .toggle-icon::before { content: "\f285"; font-family: "bootstrap-icons"; }
        .event-card:not(.is-collapsed) .toggle-icon::before { content: "\f282"; font-family: "bootstrap-icons"; }

        .toggle-row {
            cursor: pointer;
            user-select: none;
        }

        .progress {
            border-radius: 4px;
        }

        .desc-truncated {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .desc-truncated:hover {
            text-decoration: underline dotted;
        }

        #loadingSpinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            border: 10px solid #f3f3f3;
            border-top: 10px solid #ff4709;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- Loading Spinner -->
    <div id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <div class="container py-4" style="max-width: 720px;">
        <!-- Header -->
        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
            <h5 class="mb-0 fw-bold">
                <i class="bi bi-calendar3 me-2 text-uj-primary"></i>Day Schedule
            </h5>
            <div class="d-flex align-items-center gap-2">
                <input type="date" id="datePicker" class="form-control form-control-sm w-auto">
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="dropdown" aria-label="Options">
                        <i class="bi bi-list fs-5"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" onclick="expandAll(); return false;">
                            <i class="bi bi-chevron-bar-expand me-2"></i>Expand all
                        </a></li>
                        <li><a class="dropdown-item" href="#" onclick="collapseAll(); return false;">
                            <i class="bi bi-chevron-bar-contract me-2"></i>Collapse all
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="resetView(); return false;">
                            <i class="bi bi-layout-text-sidebar me-2"></i>Default view
                        </a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Event cards -->
        <div id="eventContainer"></div>

        <!-- No events -->
        <div id="noEvents" class="d-none text-center text-muted py-5">
            <i class="bi bi-calendar-x" style="font-size: 2.5rem;"></i>
            <p class="mt-3 mb-0">No events scheduled for this day.</p>
        </div>

        <!-- Error -->
        <div id="errorMsg" class="d-none alert alert-danger"></div>
    </div>

    <!-- Footer -->
    <footer class="mt-2 py-3 border-top">
        <div class="container text-center text-muted" style="font-size: 0.75rem; max-width: 720px;">
            <span id="termsNote"></span>
        </div>
    </footer>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx79mAIC4UHh3OWMMWMsklKyWniEEHBTVwsVdqFmdCRguncLdNX4Heq9o7F_5wx_mKaLA/exec';

        const LOW_PRIORITY = ['urban jungle', 'nuon', 'climbwell', 'anna davey'];

        function isLowPriority(name) {
            const lower = (name || '').toLowerCase();
            return LOW_PRIORITY.some(kw => lower.includes(kw));
        }

        function getUrlParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = ('0' + (date.getMonth() + 1)).slice(-2);
            const d = ('0' + date.getDate()).slice(-2);
            return `${y}-${m}-${d}`;
        }

        function formatTimeRange(startAt, endAt) {
            const parseTime = str => {
                const [h, m] = str.substring(11, 16).split(':').map(Number);
                const ampm = h >= 12 ? 'PM' : 'AM';
                return `${h % 12 || 12}:${('0' + m).slice(-2)} ${ampm}`;
            };
            return `${parseTime(startAt)} – ${parseTime(endAt)}`;
        }

        function formatVerifiedDate(dateStr) {
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const [y, m, d] = dateStr.split('-').map(Number);
            return `${d} ${months[m - 1]} ${y}`;
        }

        function spotsBadgeStyle(spotsLeft, totalCapacity) {
            if (spotsLeft === 0) return 'background:#dc3545; color:#fff;';
            const pct = (spotsLeft / totalCapacity) * 100;
            if (pct <= 20) return 'background:#c47a00; color:#fff;';
            return 'background:#198754; color:#fff;';
        }

        function formatNextSession(isoStr) {
            if (!isoStr) return null;
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const [y, m, d] = isoStr.substring(0, 10).split('-').map(Number);
            const dow = new Date(y, m - 1, d).getDay();
            return `${days[dow]} ${d} ${months[m - 1]}`;
        }

        function toggleCard(el) {
            el.closest('.event-card').classList.toggle('is-collapsed');
        }

        function expandAll() {
            document.querySelectorAll('.event-card').forEach(c => c.classList.remove('is-collapsed'));
        }

        function collapseAll() {
            document.querySelectorAll('.event-card').forEach(c => c.classList.add('is-collapsed'));
        }

        function resetView() {
            document.querySelectorAll('.event-card').forEach(c => {
                c.classList.toggle('is-collapsed', isLowPriority(c.dataset.name || ''));
            });
        }

        function buildCard(event) {
            const low = isLowPriority(event.event_name);
            const collapsedClass = low ? 'is-collapsed' : '';
            const timeStr = formatTimeRange(event.event_start_at, event.event_end_at);
            const pct = event.total_capacity > 0
                ? Math.round((event.booking_count / event.total_capacity) * 100)
                : 0;
            const spotsLeft = event.spaces_available;
            const spotsLabel = spotsLeft === 0 ? 'Full' : spotsLeft === 1 ? '1 spot left' : `${spotsLeft} spots left`;
            const spotsBadge = spotsBadgeStyle(spotsLeft, event.total_capacity);

            // Series pill
            let seriesPillHtml = '';
            if (event.series && event.series.is_series) {
                const s = event.series;
                const nextStr = s.next_session ? `Next: ${formatNextSession(s.next_session)}` : 'Last session this term';
                const tooltipText = `Session ${s.session_number} of ${s.total_in_term} this term · ${nextStr}`;
                seriesPillHtml = `<span class="badge rounded-pill border fw-normal"
                    style="background:#f8f9fa; font-size:0.75rem; cursor:default; color:#212529;"
                    data-bs-toggle="tooltip" data-bs-title="${tooltipText}">
                    <i class="bi bi-arrow-repeat me-1"></i>${s.session_number} of ${s.total_in_term}
                </span>`;
            }

            // Description: truncated to one line, click to expand
            const descHtml = event.event_description
                ? `<p class="card-text small text-muted mb-3 desc-truncated"
                      onclick="this.classList.toggle('desc-truncated')"
                      title="Click to expand">${event.event_description}</p>`
                : '';

            const toggleRow = `
                <div class="toggle-row d-flex justify-content-between align-items-center"
                     onclick="toggleCard(this)">
                    <span>
                        <i class="toggle-icon me-2"></i><strong>${event.event_name}</strong>
                    </span>
                    <span class="text-muted small ms-3 text-nowrap">${timeStr}</span>
                </div>`;

            const fullBody = `
                <div class="card-full">
                    <hr class="my-2">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <span class="text-muted small">${timeStr}</span>
                        ${seriesPillHtml}
                    </div>
                    <p class="text-muted small mb-2">
                        <i class="bi bi-person me-1"></i>${event.instructor_name || 'UJ Team'} · ${event.location_name}
                    </p>
                    ${descHtml}
                    <div class="d-flex justify-content-between align-items-center small mb-1">
                        <span class="text-muted"><strong>${event.booking_count}</strong> / ${event.total_capacity} booked</span>
                        <span class="badge rounded-pill" style="${spotsBadge}">${spotsLabel}</span>
                    </div>
                    <div class="progress" style="height: 7px;">
                        <div class="progress-bar bg-secondary" style="width: ${pct}%;" role="progressbar"></div>
                    </div>
                </div>`;

            return `
                <div class="card mb-2 shadow-sm event-card ${collapsedClass}" data-name="${event.event_name.replace(/"/g, '&quot;')}">
                    <div class="card-body py-2">
                        ${toggleRow}
                        ${fullBody}
                    </div>
                </div>`;
        }

        function dayViewCallback(data) {
            document.getElementById('loadingSpinner').style.display = 'none';

            if (data.error) {
                document.getElementById('errorMsg').textContent = 'Error: ' + data.error;
                document.getElementById('errorMsg').classList.remove('d-none');
                return;
            }

            if (data.terms_last_verified) {
                document.getElementById('termsNote').innerHTML =
                    `WA school term dates last verified ${formatVerifiedDate(data.terms_last_verified)} · ` +
                    `<a href="https://www.education.wa.edu.au/future-term-dates" target="_blank" class="text-muted">education.wa.edu.au</a>`;
            }

            const events = data.events || [];
            if (events.length === 0) {
                document.getElementById('noEvents').classList.remove('d-none');
                return;
            }

            document.getElementById('eventContainer').innerHTML = events.map(buildCard).join('');
            document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
        }

        function loadData(date) {
            document.getElementById('loadingSpinner').style.display = 'flex';
            document.getElementById('eventContainer').innerHTML = '';
            document.getElementById('noEvents').classList.add('d-none');
            document.getElementById('errorMsg').classList.add('d-none');

            const script = document.createElement('script');
            script.src = GAS_URL
                + '?attribute=dayViewJsonp'
                + '&date=' + date
                + '&callback=dayViewCallback';
            script.onerror = () => {
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('errorMsg').textContent = 'Failed to load data. Check your connection.';
                document.getElementById('errorMsg').classList.remove('d-none');
            };
            document.head.appendChild(script);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const today = formatDate(new Date());
            const dateParam = getUrlParam('date') || today;

            const picker = document.getElementById('datePicker');
            picker.value = dateParam;
            picker.addEventListener('change', () => {
                const newDate = picker.value;
                const url = new URL(window.location.href);
                url.searchParams.set('date', newDate);
                window.history.pushState({}, '', url);
                loadData(newDate);
            });

            loadData(dateParam);
        });
    </script>
</body>

</html>
